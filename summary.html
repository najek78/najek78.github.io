
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podsumowanie – Złote Heimerki 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: #D3AF37;
  font-family: 'Cinzel', serif;

  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;

  background:
    linear-gradient(
      rgba(2,8,23,0.72),
      rgba(2,8,23,0.84)
    ),
    url("tloo.png") center center / cover fixed no-repeat;

  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;

  background:
    radial-gradient(circle at 25% 30%, rgba(255,215,0,0.10), transparent 40%),
    radial-gradient(circle at 75% 70%, rgba(255,215,0,0.08), transparent 45%),
    radial-gradient(circle at 60% 20%, rgba(255,215,0,0.06), transparent 35%);
}

body::after {
  content: "";
  position: fixed;
  top: 35%;
  left: 50%;
  width: 900px;
  height: 900px;
  transform: translate(-50%,-50%);
  pointer-events: none;
  z-index: 0;

  background: radial-gradient(
    circle,
    rgba(255,215,0,0.12),
    transparent 65%
  );
}

body > * {
  position: relative;
  z-index: 1;
}

h1 {
  margin-top: 20px;
  letter-spacing: 4px;
  text-align: center;

  text-shadow:
    0 0 12px rgba(255,215,0,0.4),
    0 0 25px rgba(255,215,0,0.2);
}

#summary {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  padding: 0 20px;
}

.summary-card {
  position: relative;
  overflow: hidden;

  width: 900px;
  max-width: 95%;

  border: 2px solid #D3AF37;
  border-radius: 18px;
  padding: 18px;
  margin-top: 25px;

  box-shadow:
    0 0 18px rgba(255,215,0,0.25),
    0 0 35px rgba(255,215,0,0.08);

  opacity: 0;
  transform: translateY(40px);

  animation: cardAppear 0.7s ease forwards;

  transition: 0.3s;
}

/* TŁO KAŻDEGO PODSUMOWANIA */

.summary-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;

  background:
    linear-gradient(
      rgba(2,8,23,0.48),
      rgba(2,8,23,0.68)
    ),
    url("tlokat3.png") center center / cover no-repeat;
}

.summary-card > * {
  position: relative;
  z-index: 1;
}

.summary-card:hover {
  border-color: #FFD700;

  box-shadow:
    0 0 25px rgba(255,215,0,0.4),
    0 0 45px rgba(255,215,0,0.15);
}

@keyframes cardAppear {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.category-title {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 18px;

  color: #FFD700;

  text-shadow:
    0 0 8px rgba(255,215,0,0.8),
    0 0 18px rgba(255,215,0,0.6);
}

.ranking-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}

.rank-slot {
  text-align: center;
  min-width: 100px;

  text-shadow: 0 0 8px rgba(0,0,0,0.9);
}

.rank-avatar {
  width: 80px;
  height: 80px;
  object-fit: cover;

  border-radius: 50%;
  border: 3px solid #D3AF37;

  box-shadow:
    0 0 12px rgba(255,215,0,0.5),
    0 0 25px rgba(255,215,0,0.2);

  margin-top: 6px;
}

button {
  background: #D3AF37;
  color: #0b1b3a;

  border: 2px solid #D3AF37;
  padding: 14px 36px;
  border-radius: 12px;

  font-family: 'Cinzel', serif;
  font-weight: bold;

  cursor: pointer;
  margin: 40px 0;

  transition: 0.25s;

  box-shadow: 0 0 15px rgba(255,215,0,0.2);
}

button:hover {
  background: #ffd700;
  transform: scale(1.05);

  box-shadow:
    0 0 20px rgba(255,215,0,0.5),
    0 0 35px rgba(255,215,0,0.2);
}

/* TELEFONY */

@media (max-width: 700px) {
  h1 {
    font-size: 26px;
    letter-spacing: 3px;
  }

  .summary-card {
    width: 100%;
    padding: 14px;
  }

  .category-title {
    font-size: 27px;
  }

  .ranking-row {
    gap: 18px;
  }

  .rank-slot {
    min-width: 75px;
    font-size: 12px;
  }

  .rank-avatar {
    width: 65px;
    height: 65px;
  }

  button {
    padding: 12px 22px;
    font-size: 13px;
  }
}

</style>
</head>

<body>

<h1>TWOJE GŁOSY</h1>

<div id="summary"></div>

<button onclick="window.location.href='categories.html'">
Powrót do kategorii
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://vxbdvwjxudlxybnfsugn.supabase.co/",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4YmR2d2p4dWRseHlibmZzdWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExODQyODEsImV4cCI6MjA4Njc2MDI4MX0.ZJG2DTwhcj8nG9eyUN1B3Zuf2IFIIZcq1rYpsYptrBk"
);

async function loadSummary() {

  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  const { data: votes, error: votesError } = await supabaseClient
    .from("votes")
    .select("*")
    .eq("user_id", user.id);

  const { data: categories, error: categoriesError } = await supabaseClient
    .from("categories")
    .select("*");

  const { data: nominees, error: nomineesError } = await supabaseClient
    .from("nominees")
    .select("*");

  if (votesError || categoriesError || nomineesError) {
    console.error(votesError || categoriesError || nomineesError);
    return;
  }

  const container = document.getElementById("summary");
  container.innerHTML = "";

  votes.forEach((v, index) => {

    const category = categories.find(c => c.id == v.category_id);

    if (!category) return;

    const getNominee = (id) => nominees.find(n => n.id == id);

    const ranks = [
      getNominee(v.rank1),
      getNominee(v.rank2),
      getNominee(v.rank3),
      getNominee(v.rank4),
      getNominee(v.rank5)
    ];

    const card = document.createElement("div");
    card.className = "summary-card";
    card.style.animationDelay = (index * 0.2) + "s";

    let rankingHTML = "";

    ranks.forEach((n, i) => {
      if (!n) return;

      rankingHTML += `
        <div class="rank-slot">
          <div>Miejsce ${i+1}</div>
          <img src="${n.avatar_url}" class="rank-avatar">
          <div>${n.name}</div>
        </div>
      `;
    });

    card.innerHTML = `
      <div class="category-title">${category.name}</div>
      <div class="ranking-row">
        ${rankingHTML}
      </div>
    `;

    container.appendChild(card);
  });
}

loadSummary();
</script>

</body>
</html>
