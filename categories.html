
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategorie – Złote Heimerki 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>


* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: #D3AF37;
  font-family: 'Cinzel', serif;

  background:
    linear-gradient(
      rgba(2,8,23,0.72),
      rgba(2,8,23,0.82)
    ),
    url("tloo.png") center center / cover fixed no-repeat;

  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;

  background:
    radial-gradient(circle at 25% 30%, rgba(255,215,0,0.10), transparent 40%),
    radial-gradient(circle at 75% 70%, rgba(255,215,0,0.08), transparent 45%),
    radial-gradient(circle at 60% 20%, rgba(255,215,0,0.06), transparent 35%);
}

body::after {
  content: "";
  position: fixed;
  top: 35%;
  left: 50%;
  width: 900px;
  height: 900px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 0;

  background: radial-gradient(
    circle,
    rgba(255,215,0,0.12),
    transparent 65%
  );
}

.user-avatar {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 3px solid #D3AF37;
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
  z-index: 5;
}

.title {
  position: relative;
  z-index: 1;
  text-align: center;
  font-size: 42px;
  margin: 25px 0 35px;
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(255,215,0,0.4);
}

.top-buttons {
  position: absolute;
  top: 20px;
  left: 20px;
  display: flex;
  gap: 12px;
  z-index: 5;
}

button {
  background: #D3AF37;
  color: #0b1b3a;
  border: none;
  padding: 10px 18px;
  font-size: 14px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Cinzel', serif;
  font-weight: bold;
  transition: 0.25s;
}

button:hover {
  background: #ffd700;
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
}

.grid {
  position: relative;
  z-index: 1;

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;

  padding: 20px 80px 50px;
  max-width: 1700px;
  margin: auto;
}

.card {
  position: relative;
  overflow: hidden;

  border: 2px solid #D3AF37;
  border-radius: 18px;
  padding: 18px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  min-height: 165px;

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease;

  opacity: 0;
  animation: cardFade 0.7s ease forwards;
}

/* TŁO KART */

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;

  background:
    linear-gradient(
      rgba(2,8,23,0.40),
      rgba(2,8,23,0.60)
    ),
    url("tlokat2.png") center center / cover no-repeat;
}

.card:hover {
  transform: translateY(-7px);

  box-shadow:
    0 0 18px rgba(255,215,0,0.4),
    0 0 35px rgba(255,215,0,0.2);
}

@keyframes cardFade {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card h2 {
  font-size: 20px;
  margin: 0 0 8px;
  text-align: center;
  position: relative;
  z-index: 2;
}

.status {
  font-size: 13px;
  opacity: 0.9;
  margin-bottom: 12px;
  position: relative;
  z-index: 2;
}

.card.voted {
  border-color: #00ff9c;

  box-shadow:
    0 0 12px rgba(0,255,156,0.35),
    0 0 25px rgba(0,255,156,0.15);
}

.card.not-voted {
  border-color: #ff3b3b;

  box-shadow:
    0 0 12px rgba(255,59,59,0.35),
    0 0 25px rgba(255,59,59,0.15);
}

.mini-nominees {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);

  display: grid;
  grid-template-columns: repeat(2, 46px);
  grid-template-rows: repeat(3, 46px);
  gap: 8px;

  pointer-events: none;
  z-index: 2;
}

.mini-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid #D3AF37;
  object-fit: cover;

  box-shadow:
    0 0 10px rgba(255,215,0,0.5),
    0 0 22px rgba(255,215,0,0.2);
}

.mini-avatar.fifth {
  grid-column: 1 / span 2;
  justify-self: center;
}

.card-content {
  position: relative;
  z-index: 2;
  text-align: center;
  width: 65%;
}

.card button {
  position: relative;
  z-index: 2;
}

.top-buttons button {
  white-space: nowrap;
}

.card.last-card {
  grid-column: 2;
}

/* RESPONSYWNOŚĆ */

@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    padding: 20px 35px 40px;
  }

  .card.last-card {
    grid-column: 1 / -1;
    width: 50%;
    justify-self: center;
  }
}

@media (max-width: 650px) {
  .grid {
    grid-template-columns: 1fr;
    padding: 20px;
  }

  .title {
    font-size: 30px;
    margin-top: 110px;
  }

  .top-buttons {
    top: 15px;
    left: 15px;
  }

  .user-avatar {
    width: 55px;
    height: 55px;
    top: 12px;
    right: 12px;
  }

  .card {
    min-height: 155px;
  }

  .card.last-card {
    grid-column: auto;
    width: 100%;
  }

  .mini-nominees {
    right: 10px;
    grid-template-columns: repeat(2, 36px);
    grid-template-rows: repeat(3, 36px);
  }

  .mini-avatar {
    width: 36px;
    height: 36px;
  }

  .card-content {
    width: 65%;
  }
}


</style>
</head>

<body>

<img id="avatar" class="user-avatar">

<div class="top-buttons">

  <button onclick="window.location.href='summary.html'">
    Podsumowanie
  </button>

  <button onclick="logout()">
    Wyloguj
  </button>

</div>

<h1 class="title">KATEGORIE</h1>

<div id="categories" class="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const { createClient } = supabase;

const supabaseClient = createClient(
  "https://vxbdvwjxudlxybnfsugn.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4YmR2d2p4dWRseHlibmZzdWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExODQyODEsImV4cCI6MjA4Njc2MDI4MX0.ZJG2DTwhcj8nG9eyUN1B3Zuf2IFIIZcq1rYpsYptrBk"
);

const categoryOrder = [
  "Event roku",
  "Historia roku",
  "Aura roku",
  "Ragebait roku",
  "Fail roku",
  "Riposta roku",
  "Cytat roku",
  "LC klip roku",
  "Peak klip roku",
  "Klip roku"
];

async function checkUser() {

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "index.html";
    return null;
  }

  document.getElementById("avatar").src =
    user.user_metadata.avatar_url;

  return user;
}

async function loadCategories() {

  const user = await checkUser();

  if (!user) return;

  const { data: categories, error: categoriesError } =
    await supabaseClient
      .from("categories")
      .select("*");

  const { data: votes, error: votesError } =
    await supabaseClient
      .from("votes")
      .select("*")
      .eq("user_id", user.id);

  const { data: nominees, error: nomineesError } =
    await supabaseClient
      .from("nominees")
      .select("*");

  if (categoriesError || votesError || nomineesError) {
    console.error(
      categoriesError || votesError || nomineesError
    );
    return;
  }

  const container = document.getElementById("categories");

  container.innerHTML = "";

  // Ustawienie kolejności dziesięciu kategorii
  categories.sort((a, b) => {
    const indexA = categoryOrder.indexOf(a.name);
    const indexB = categoryOrder.indexOf(b.name);

    return (indexA === -1 ? 999 : indexA) -
           (indexB === -1 ? 999 : indexB);
  });

  categories.forEach((category, index) => {

    const voted = votes.some(
      v => v.category_id == category.id
    );

    const categoryNominees = nominees
      .filter(n => n.category_id == category.id)
      .slice(0, 5);

    const div = document.createElement("div");

    div.className = "card " +
      (voted ? "voted" : "not-voted");

    if (index === 9) {
      div.classList.add("last-card");
    }

    div.style.animationDelay = `${index * 0.08}s`;

    const mini = document.createElement("div");
    mini.className = "mini-nominees";

    categoryNominees.forEach((n, i) => {

      const img = document.createElement("img");

      img.src = n.avatar_url;
      img.className =
        "mini-avatar" + (i === 4 ? " fifth" : "");

      mini.appendChild(img);

    });

    const content = document.createElement("div");
    content.className = "card-content";

    const title = document.createElement("h2");
    title.textContent = category.name;

    const status = document.createElement("div");
    status.className = "status";
    status.textContent = voted
      ? "✔ Zagłosowano"
      : "❌ Nie zagłosowano";

    content.appendChild(title);
    content.appendChild(status);

    div.appendChild(mini);
    div.appendChild(content);

    if (!voted) {

      const button = document.createElement("button");

      button.textContent = "Głosuj";

      button.addEventListener("click", () => {
        goToVote(category.id);
      });

      div.appendChild(button);

    }

    container.appendChild(div);

  });

}

function goToVote(categoryId) {
  window.location.href =
    "vote.html?category=" + categoryId;
}

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";

}

loadCategories();

</script>

</body>
</html>
