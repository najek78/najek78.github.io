
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Głosowanie</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>


* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: #D3AF37;
  font-family: 'Cinzel', serif;

  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;

  background:
    linear-gradient(
      rgba(2,8,23,0.72),
      rgba(2,8,23,0.84)
    ),
    url("tloo.png") center center / cover fixed no-repeat;

  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;

  background:
    radial-gradient(circle at 25% 30%, rgba(255,215,0,0.10), transparent 40%),
    radial-gradient(circle at 75% 70%, rgba(255,215,0,0.08), transparent 45%),
    radial-gradient(circle at 60% 20%, rgba(255,215,0,0.06), transparent 35%);
}

body::after {
  content: "";
  position: fixed;
  top: 35%;
  left: 50%;
  width: 900px;
  height: 900px;
  transform: translate(-50%,-50%);
  pointer-events: none;
  z-index: 0;

  background: radial-gradient(
    circle,
    rgba(255,215,0,0.12),
    transparent 65%
  );
}

body > * {
  position: relative;
  z-index: 1;
}

h1 {
  margin-top: 20px;
  letter-spacing: 4px;
  text-align: center;
  text-shadow: 0 0 18px rgba(255,215,0,0.35);
}

h2 {
  letter-spacing: 3px;
  text-shadow: 0 0 15px rgba(255,215,0,0.3);
}

.nominees-row {
  display: flex;
  gap: 18px;
  margin-top: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.nominee-card {
  width: 320px;

  background: rgba(2,8,23,0.65);
  backdrop-filter: blur(10px);

  border: 2px solid #D3AF37;
  border-radius: 18px;
  padding: 14px;
  text-align: center;

  box-shadow:
    0 0 18px rgba(255,215,0,0.2),
    inset 0 0 20px rgba(255,215,0,0.04);

  transition: 0.3s;
}

.nominee-card:hover {
  transform: translateY(-5px);

  box-shadow:
    0 0 22px rgba(255,215,0,0.4),
    0 0 40px rgba(255,215,0,0.12);
}

.nominee-avatar {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #D3AF37;

  box-shadow: 0 0 15px rgba(255,215,0,0.35);
}

.video-frame {
  position: relative;
  width: 100%;
  height: 170px;
  border: 2px solid #D3AF37;
  border-radius: 12px;
  overflow: hidden;

  box-shadow: 0 0 12px rgba(255,215,0,0.15);
}

.video-frame iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 110%;
  height: 120%;
  transform: translate(-50%,-50%);
  border: none;
}

.ranking-row {
  display: flex;
  gap: 34px;
  margin-top: 35px;
  flex-wrap: wrap;
  justify-content: center;
}

.rank-slot {
  width: 120px;
  text-align: center;
}

.dropzone {
  margin-top: 10px;
  height: 90px;

  background: rgba(2,8,23,0.55);
  backdrop-filter: blur(8px);

  border: 2px dashed #D3AF37;
  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: 0.25s;
}

.dropzone:hover {
  background: rgba(255,215,0,0.10);
  box-shadow: 0 0 15px rgba(255,215,0,0.25);
}

.rank-avatar {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #D3AF37;

  box-shadow: 0 0 12px rgba(255,215,0,0.4);
}

.locked {
  border-color: #888;
  opacity: 0.6;
}

.drag-avatars {
  display: flex;
  gap: 22px;
  margin-top: 25px;
  flex-wrap: wrap;
  justify-content: center;
}

.drag-avatar {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #D3AF37;
  cursor: grab;

  box-shadow: 0 0 12px rgba(255,215,0,0.25);
  transition: 0.2s;
}

.drag-avatar:hover:not(.used) {
  transform: scale(1.12);
  box-shadow: 0 0 20px rgba(255,215,0,0.6);
}

.drag-avatar.used {
  filter: grayscale(1);
  opacity: 0.35;
  cursor: not-allowed;
}

.buttons-row {
  display: flex;
  gap: 20px;
  margin-top: 30px;
  margin-bottom: 40px;
}

button {
  background: #D3AF37;
  color: #0b1b3a;
  border: none;
  padding: 14px 36px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  font-family: 'Cinzel', serif;
  transition: 0.2s;
}

button:hover:not(:disabled) {
  background: #ffd700;
  transform: scale(1.05);
  box-shadow: 0 0 18px rgba(255,215,0,0.4);
}

button:disabled {
  background: #555;
  cursor: not-allowed;
}

.nominee-card h3 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  margin: 8px 0 10px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* RESPONSYWNOŚĆ */

@media (max-width: 700px) {
  .nominee-card {
    width: min(320px, 90vw);
  }

  .ranking-row {
    gap: 15px;
  }

  .rank-slot {
    width: 100px;
  }

  .buttons-row {
    flex-wrap: wrap;
    justify-content: center;
  }
}


</style>
</head>

<body>

<h1 id="categoryTitle"></h1>

<div id="nominees" class="nominees-row"></div>

<div id="ranking" class="ranking-row"></div>

<h2>UŁÓŻ KOLEJNOŚĆ</h2>

<div id="dragAvatars" class="drag-avatars"></div>

<div class="buttons-row">

  <button id="voteBtn" onclick="submitVote()" disabled>
    Zagłosuj
  </button>

  <button onclick="resetRanking()">
    Resetuj
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const { createClient } = supabase;

const supabaseClient = createClient(
  "https://vxbdvwjxudlxybnfsugn.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4YmR2d2p4dWRseHlibmZzdWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExODQyODEsImV4cCI6MjA4Njc2MDI4MX0.ZJG2DTwhcj8nG9eyUN1B3Zuf2IFIIZcq1rYpsYptrBk"
);

const params = new URLSearchParams(window.location.search);
const categoryId = params.get("category");

let nomineesList = [];
let selected = {};
let selfNominee = null;

async function checkCategory() {

  const { data, error } = await supabaseClient
    .from("categories")
    .select("*")
    .eq("id", categoryId)
    .single();

  if (error || !data) {
    alert("Nie znaleziono kategorii.");
    window.location.href = "categories.html";
    return false;
  }

  document.getElementById("categoryTitle").textContent =
    data.name;

  return true;
}

async function loadNominees() {

  if (!categoryId) {
    window.location.href = "categories.html";
    return;
  }

  const validCategory = await checkCategory();

  if (!validCategory) return;

  const { data, error } = await supabaseClient
    .from("nominees")
    .select("*")
    .eq("category_id", categoryId);

  if (error) {
    console.error(error);
    alert("Nie udało się pobrać nominowanych.");
    return;
  }

  nomineesList = data || [];

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  selfNominee = nomineesList.find(
    n => n.user_id === user.id
  );

  renderNominees();
  renderDragAvatars();
  createRanking();

}

loadNominees();

function renderNominees() {

  const container = document.getElementById("nominees");

  container.innerHTML = "";

  nomineesList.forEach(n => {

    const card = document.createElement("div");
    card.className = "nominee-card";

    const name = document.createElement("h3");
    name.textContent = n.name;

    const avatar = document.createElement("img");
    avatar.src = n.avatar_url;
    avatar.className = "nominee-avatar";

    const video = document.createElement("div");
    video.className = "video-frame";

    const iframe = document.createElement("iframe");
    iframe.src = n.video_url;
    iframe.allowFullscreen = true;

    video.appendChild(iframe);

    card.appendChild(name);
    card.appendChild(avatar);
    card.appendChild(video);

    container.appendChild(card);

  });

}

function renderDragAvatars() {

  const dragContainer = document.getElementById("dragAvatars");

  dragContainer.innerHTML = "";

  nomineesList.forEach(n => {

    const isSelf = selfNominee && n.id === selfNominee.id;

    const img = document.createElement("img");

    img.src = n.avatar_url;

    img.className =
      "drag-avatar" + (isSelf ? " used" : "");

    img.draggable = !isSelf;
    img.dataset.id = n.id;

    img.addEventListener("dragstart", drag);

    dragContainer.appendChild(img);

  });

}

function createRanking() {

  const container = document.getElementById("ranking");

  container.innerHTML = "";

  for (let i = 1; i <= 5; i++) {

    const slot = document.createElement("div");
    slot.className = "rank-slot";

    const zone = document.createElement("div");
    zone.className = "dropzone";
    zone.id = "rank" + i;

    zone.ondragover = e => e.preventDefault();
    zone.ondrop = drop;

    if (i === 5 && selfNominee) {

      zone.classList.add("locked");

      zone.innerHTML =
        `<img src="${selfNominee.avatar_url}" class="rank-avatar">`;

      zone.dataset.value = selfNominee.id;

      selected[zone.id] = selfNominee.id;

    }

    slot.innerHTML = `Miejsce ${i}`;

    slot.appendChild(zone);

    container.appendChild(slot);

  }

  checkCompletion();

}

function drag(ev) {

  ev.dataTransfer.setData(
    "text",
    ev.target.dataset.id
  );

}

function drop(ev) {

  ev.preventDefault();

  const id = ev.dataTransfer.getData("text");
  const zone = ev.currentTarget;

  if (zone.classList.contains("locked")) return;

  if (Object.values(selected).includes(id)) return;

  const nominee = nomineesList.find(
    n => n.id == id
  );

  if (!nominee) return;

  zone.innerHTML =
    `<img src="${nominee.avatar_url}" class="rank-avatar">`;

  zone.dataset.value = id;

  selected[zone.id] = id;

  markUsed();
  checkCompletion();

}

function markUsed() {

  document.querySelectorAll(".drag-avatar").forEach(a => {

    const id = a.dataset.id;

    if (selfNominee && id == selfNominee.id) {

      a.classList.add("used");
      a.draggable = false;

      return;

    }

    if (Object.values(selected).includes(id)) {

      a.classList.add("used");
      a.draggable = false;

    } else {

      a.classList.remove("used");
      a.draggable = true;

    }

  });

}

function checkCompletion() {

  const filled = [
    "rank1",
    "rank2",
    "rank3",
    "rank4",
    "rank5"
  ].every(id => {
    const zone = document.getElementById(id);
    return zone && zone.dataset.value;
  });

  document.getElementById("voteBtn").disabled = !filled;

}

function resetRanking() {

  selected = {};

  document.querySelectorAll(".dropzone").forEach(zone => {

    if (zone.id === "rank5" && selfNominee) {

      zone.innerHTML =
        `<img src="${selfNominee.avatar_url}" class="rank-avatar">`;

      zone.dataset.value = selfNominee.id;

      selected[zone.id] = selfNominee.id;

      return;

    }

    zone.innerHTML = "";
    zone.dataset.value = "";

  });

  markUsed();
  checkCompletion();

}

async function submitVote() {

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if (!user) {
    alert("Musisz być zalogowany.");
    window.location.href = "index.html";
    return;
  }

  const { error } = await supabaseClient
    .from("votes")
    .insert({
      user_id: user.id,
      category_id: categoryId,
      rank1: document.getElementById("rank1").dataset.value,
      rank2: document.getElementById("rank2").dataset.value,
      rank3: document.getElementById("rank3").dataset.value,
      rank4: document.getElementById("rank4").dataset.value,
      rank5: document.getElementById("rank5").dataset.value
    });

  if (error) {
    console.error(error);
    alert("Nie udało się zapisać głosu.");
    return;
  }

  alert("Głos zapisany!");

  window.location.href = "categories.html";

}

</script>

</body>
</html>
